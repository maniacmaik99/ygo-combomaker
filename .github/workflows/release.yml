# Baut die App für Linux und Windows, sobald ein Tag wie v0.2.0 gepusht wird,
# und hängt die Programme an ein GitHub-Release. Der Update-Knopf in der App
# lädt genau diese Dateien.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: ygo-combomaker
            asset: ygo-combomaker-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ygo-combomaker.exe
            asset: ygo-combomaker-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version im Tag muss zu Cargo.toml passen
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu Cargo.toml (v$CARGO_VERSION)"; exit 1
          fi
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Datei umbenennen
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
