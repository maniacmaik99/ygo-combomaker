# Erstellt automatisch ein Release, sobald auf main eine Version in
# Cargo.toml steht, für die es noch kein Release gibt.
# Ablauf für eine neue Version: Version in Cargo.toml erhöhen, pushen. Fertig.
# Der Update-Knopf in der App lädt die hier gebauten Dateien.
name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION gibt es schon, nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: ygo-combomaker
            asset: ygo-combomaker-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ygo-combomaker.exe
            asset: ygo-combomaker-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Datei umbenennen
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      # Linux: zusätzlich .deb (Debian/Ubuntu), .rpm (Fedora) und .tar.gz.
      - name: Linux-Pakete bauen
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p target/release pkg
          cp target/${{ matrix.target }}/release/ygo-combomaker target/release/ygo-combomaker
          strip target/release/ygo-combomaker
          cargo deb --no-build --no-strip --output pkg/ygo-combomaker-linux-amd64.deb
          cargo generate-rpm --output pkg/ygo-combomaker-linux-x86_64.rpm
          mkdir ygo-combomaker
          cp target/release/ygo-combomaker install.sh assets/ygo-combomaker.desktop assets/icon-512.png README.md ygo-combomaker/
          tar czf pkg/ygo-combomaker-linux-x86_64.tar.gz ygo-combomaker
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-packages
          path: pkg/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
