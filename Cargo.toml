[package]
name = "ygo-combomaker"
version = "0.6.2"
edition = "2024"
description = "Desktop-App zum Eintragen und Üben von Yu-Gi-Oh!-Combos"
license = "MIT"
repository = "https://github.com/maniacmaik99/ygo-combomaker"

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
self-replace = "1.5.1"
base64 = "0.23.1"
sys-locale = "0.3.2"

[build-dependencies]
# Bettet unter Windows das Icon in die .exe ein (siehe build.rs).
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
